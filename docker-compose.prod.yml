# The OCI ARM VM side of docs/40-delivery/02-devops-and-cicd.md §4/§6 — Caddy in front
# of the api container, TLS handled automatically. Pulls a pre-built image rather than
# building on the VM (the image is built and pushed by CI, arm64, per the documented
# pipeline: build -> push to OCI Container Registry -> SSH -> `docker compose pull`).
#
# No `worker` or `redis` service here yet, unlike the dev compose file — nothing in this
# codebase consumes a job queue today (BullMQ is documented, not built). Add both back
# when that work actually exists; provisioning infrastructure nothing reads from is a
# cost with no corresponding benefit.
#
# Required on the VM before first run: an .env.prod file (never committed) with
# ORACLE_USER, ORACLE_PASSWORD, ORACLE_CONNECT_STRING (the Autonomous Database's own
# connection string, not the local dev one), JWT_SECRET, and APP_BASE_URL — see
# .env.example for the full list. Secrets belong in OCI Vault, injected at deploy time,
# never written into this file or the image.

services:
  api:
    image: ${REGISTRY:-iad.ocir.io/your-tenancy}/masjid-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.prod
    environment:
      NODE_ENV: production
      PORT: 3000
    expose:
      - '3000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  caddy-data:
  caddy-config:
