services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD:-devsyspassword}
      APP_USER: masjid
      APP_USER_PASSWORD: ${ORACLE_PASSWORD:-devpassword}
    ports: ['1521:1521']
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./docker/initdb:/container-entrypoint-initdb.d
    healthcheck:
      test: ['CMD', 'healthcheck.sh']
      interval: 10s
      timeout: 5s
      retries: 40

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']

volumes:
  oracle-data:
